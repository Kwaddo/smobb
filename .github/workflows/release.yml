name: Release

# Cut a release by pushing a version tag, e.g.:  git tag v2.0.0 && git push --tags
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: smobb-tui-linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            name: smobb-tui-macos-arm64
          - os: macos-13
            target: x86_64-apple-darwin
            name: smobb-tui-macos-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: smobb-tui-windows-x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release -p smobb-tui --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        env:
          NAME: ${{ matrix.name }}
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p pkg
          cp "target/$TARGET/release/smobb-tui" pkg/
          cp README.md pkg/
          tar -C pkg -czf "$NAME.tar.gz" .

      - name: Package (windows)
        if: runner.os == 'Windows'
        env:
          NAME: ${{ matrix.name }}
          TARGET: ${{ matrix.target }}
        run: |
          New-Item -ItemType Directory -Force -Path pkg | Out-Null
          Copy-Item "target/$env:TARGET/release/smobb-tui.exe" pkg/
          Copy-Item README.md pkg/
          Compress-Archive -Path pkg/* -DestinationPath "$env:NAME.zip"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: false
          files: |
            ${{ matrix.name }}.tar.gz
            ${{ matrix.name }}.zip
